name: Close pull requests

# Source code lands here in November 2026. Until then PRs are read as ideas, not merged.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "Thanks for this! 💛

          The source code isn't public yet (coming November 2026), so we close pull requests automatically for now. We still read them as ideas.

          - 🐞 Found a bug? [Open an issue](https://github.com/$REPO/issues/new/choose) — screenshots help a lot.
          - 💼 Want to build Awesomic with us? [We're hiring](https://www.awesomic.com/hiring)."
          gh pr close "$PR" --repo "$REPO"
